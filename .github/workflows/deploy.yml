name: HALO Production Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify client before production build
        run: npm run verify

      - name: Enforce dependency security policy before production build
        run: node scripts/security-audit-policy.mjs

      - name: Require Expo CI authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Repository Actions secret EXPO is missing or unavailable. Add a scoped Expo access token named EXPO before production builds can run."
            exit 1
          fi

      - name: Validate EAS production configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO }}
        run: |
          npx --yes eas-cli@24.8.0 whoami --non-interactive
          npx --yes eas-cli@24.8.0 config --platform ios --profile production --non-interactive
          npx --yes eas-cli@24.8.0 config --platform android --profile production --non-interactive

      - name: Build production apps with pinned EAS CLI
        env:
          EXPO_TOKEN: ${{ secrets.EXPO }}
        run: npx --yes eas-cli@24.8.0 build --platform all --profile production --non-interactive --wait
