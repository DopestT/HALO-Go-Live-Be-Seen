name: Security Gates

on:
  push:
    branches:
      - main
      - 'design/**'
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  node-audit:
    name: Node dependency and supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps
      - name: Enforce exact high/critical advisory policy
        run: node scripts/security-audit-policy.mjs
      - name: Reject unexpected lockfile package sources
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const bad = [];
          for (const [path, pkg] of Object.entries(lock.packages ?? {})) {
            const resolved = pkg?.resolved;
            if (!resolved) continue;
            if (!resolved.startsWith('https://registry.npmjs.org/')) {
              bad.push(`${path || '<root>'}: ${resolved}`);
            }
          }
          if (bad.length) {
            console.error('Unexpected package sources in package-lock.json:');
            for (const entry of bad) console.error(`- ${entry}`);
            process.exit(1);
          }
          console.log('All resolved npm package sources use the npm registry over HTTPS.');
          NODE
      - name: Verify npm registry signatures and provenance
        run: npm audit signatures

  go-security:
    name: Go race and vulnerability checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - name: Verify module files are authentic and tidy
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Race detector
        run: go test -race ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Go vulnerability scan
        run: govulncheck ./...

  repository-security-capability:
    name: Repository security capability record
    runs-on: ubuntu-latest
    steps:
      - name: Record dependency-review limitation
        run: |
          echo 'GitHub Dependency Review cannot execute until this repository has Dependency Graph enabled.'
          echo 'This workflow therefore enforces full npm audit policy, lockfile source restrictions, npm registry signature/provenance verification, Go module verification, govulncheck, and race detection directly.'
