name: Temporary feature dependency install

on:
  push:
    branches:
      - feature/nscene-topic-video-previews

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/nscene-topic-video-previews
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install Expo Video for SDK 57
        run: npm install expo-video@~57.0.5 --save --legacy-peer-deps
      - name: Commit synchronized manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add expo-video dependency"
          git push origin HEAD:feature/nscene-topic-video-previews
