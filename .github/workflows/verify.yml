name: Verify HALO

on:
  push:
    branches:
      - main
      - 'design/**'
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: Client tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Test
        run: npm run test:ci
      - name: Typecheck
        run: npm run typecheck

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build API
        run: go build ./cmd/api
