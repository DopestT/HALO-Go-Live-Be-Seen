name: Refresh HALO client dependencies

on:
  push:
    branches:
      - feature/hardened-media-pipeline
    paths:
      - .github/workflows/refresh-client-deps.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/hardened-media-pipeline

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.1
          cache: npm

      - name: Resolve Expo 57 dependency graph
        run: |
          npm config set legacy-peer-deps true
          npm install
          npx expo install --fix
          npx expo install jest-expo jest @types/jest --dev
          npm audit fix || true

      - name: Verify deprecated client packages are gone
        run: |
          if npm ls @testing-library/jest-native --all 2>/dev/null | grep -q '@testing-library/jest-native'; then
            echo 'Deprecated @testing-library/jest-native is still installed.' >&2
            exit 1
          fi
          if npm ls @types/react-native --all 2>/dev/null | grep -q '@types/react-native'; then
            echo 'Deprecated @types/react-native is still installed.' >&2
            exit 1
          fi
          npm ls jest-expo --depth=0

      - name: Commit generated dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 0
          fi
          git commit -m "chore: install SDK 57 Jest toolchain"
          git push origin HEAD:feature/hardened-media-pipeline
